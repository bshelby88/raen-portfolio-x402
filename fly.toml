app = "raen-portfolio-x402"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  X402_PAY_TO = "0x7861db4efc14a1ed5dd8c96c528a3796560f1393"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/health"
